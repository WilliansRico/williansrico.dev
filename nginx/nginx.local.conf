#NGINX CONFIGURATION FILE FOR LOCAL TESTING PURPOSES ONLY

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {

        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # SECURITY HEADERS
        add_header X-Frame-Options "DENY" always;

        add_header X-Content-Type-Options "nosniff" always;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;


        # WELL-KNOWN SECURITY FILE
        location = /.well-known/security.txt {

            default_type text/plain;
            charset utf-8;

            try_files $uri =404;
        }


        # BLOCK HIDDEN FILES
        location ~ /\. {

            access_log off;
            log_not_found off;

            return 404;
        }


        # WEBSITE ROUTING
        location / {

            autoindex off;

            try_files $uri $uri/ =404;
        }

    }
}