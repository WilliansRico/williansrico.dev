# To prevent Nginx version leakage from errors
server_tokens off;

# Instantly drops direct IP scans and unrecognized domains
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate         /etc/nginx/certs/origin-server.crt;
    ssl_certificate_key     /etc/nginx/certs/origin-server.key;

    return 444; 
}

# PRODUCTION DOMAIN BLOCK
server {
    listen 443 ssl;
    server_name williansrico.dev *.williansrico.dev;

    ssl_certificate         /etc/nginx/certs/origin-server.crt;
    ssl_certificate_key     /etc/nginx/certs/origin-server.key;

    # Client Authentication (Per-Hostname AOP mTLS)
    ssl_client_certificate  /etc/nginx/certs/aop-root-ca.crt;
    ssl_verify_client       on;


    # SECURITY POLICIES
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # Prevents clickjacking by forbidding site framing
    add_header X-Frame-Options "DENY" always;

    # Disables browser MIME-type sniffing vulnerabilities
    add_header X-Content-Type-Options "nosniff" always;

    # Mitigates XSS attacks in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Minimizes data leaked via the Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy baseline configuration
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Buffer Size Management (Mitigates buffer overflows)
    client_body_buffer_size      1k;  # Restricts size for reading client request body
    client_header_buffer_size    1k;  # Restricts size for reading client request header
    client_max_body_size         2m;  # Adjust this if your portfolio site requires larger file uploads
    large_client_header_buffers  2 1k;

    # Strict Timeout Controls (Forces dropped hanging connections)
    client_body_timeout   12s;
    client_header_timeout 12s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # CLOUDFLARE REAL IP RESTORATION
    real_ip_header CF-Connecting-IP;

    # List of official Cloudflare network ranges to trust for real IP injection
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.27.0.0/16;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.252.240.0/22;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    include nginx\mime.types;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        # If client verification fails, Nginx drops the proxy request
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

    autoindex off;


    root /williansrico.dev/site;
    index index.html index.htm;
    }
}
