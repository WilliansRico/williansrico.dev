worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # ENVIRONMENT HOSTNAME VALIDATION
    map $host $is_dev { 
        default                 0;
        dev.williansrico.dev    1;
    }

    # ALLOWED IP ADDRESS TO ACCESS DEVELOPMENT
    geo $remote_addr $home_ip_allowed {
    default             0;
    181.235.82.118/32   1;
    }

    # Reject unauthorized visitors ONLY on the dev hostname security enforcement
    map "$is_dev:$home_ip_allowed" $deny_dev {
    default     0;
    "1:0"       1;
    }

    # CLOUDFLARE REAL IP RESTORATION
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # List of official Cloudflare network ranges to trust for real IP injection

    #CLOUDFLARE IPv4 RANGES
    set_real_ip_from    173.245.48.0/20;
    set_real_ip_from    103.21.244.0/22;
    set_real_ip_from    103.22.200.0/22;
    set_real_ip_from    103.31.4.0/22;
    set_real_ip_from    141.101.64.0/18;
    set_real_ip_from    108.162.192.0/18;
    set_real_ip_from    190.93.240.0/20;
    set_real_ip_from    188.114.96.0/20;
    set_real_ip_from    197.234.240.0/22;
    set_real_ip_from    198.41.128.0/17;
    set_real_ip_from    162.158.0.0/15;
    set_real_ip_from    104.16.0.0/13;
    set_real_ip_from    104.24.0.0/14;
    set_real_ip_from    172.64.0.0/13;
    set_real_ip_from    131.0.72.0/22;

    #CLOUDFLARE IPv6 RANGES
    set_real_ip_from    2400:cb00::/32;
    set_real_ip_from    2606:4700::/32;
    set_real_ip_from    2803:f800::/32;
    set_real_ip_from    2405:b500::/32;
    set_real_ip_from    2405:8100::/32;
    set_real_ip_from    2a06:98c0::/29;
    set_real_ip_from    2c0f:f248::/32;

    map $is_dev $seo_robots {
        default     "";
        1           "noindex, nofollow";
    }

    # To prevent Nginx version leakage from errors
    server_tokens   off;

    # Instantly drops direct IP scans and unrecognized domains
    server {
        listen 443              ssl default_server;
        listen [::]:443         ssl default_server;
        server_name             _;

        ssl_certificate         /etc/nginx/certs/origin-server.crt;
        ssl_certificate_key     /etc/nginx/certs/origin-server.key;

        return 444; 
    }

    # PRODUCTION SERVER
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
            
        # Explicit hostnames required for Per-Hostname AOP
        server_name williansrico.dev dev.williansrico.dev;

        ssl_certificate         /etc/nginx/certs/origin-server.crt;
        ssl_certificate_key     /etc/nginx/certs/origin-server.key;

        # Client Authentication (Per-Hostname AOP mTLS)
        ssl_client_certificate  /etc/nginx/certs/aop-root-ca.crt;
        ssl_verify_client       on;

        # SECURITY POLICIES
        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_ciphers                 HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers   on;
        ssl_session_cache           shared:SSL:10m;
        ssl_session_timeout         1d;
        ssl_session_tickets         off;

        # Prevents clickjacking by forbidding site framing
        add_header X-Frame-Options "DENY" always;

        # Disables browser MIME-type sniffing vulnerabilities
        add_header X-Content-Type-Options "nosniff" always;

        # Mitigates XSS attacks in older browsers (DEPRICATED FOR MODERN BROWSERS BUT KEPT TO PROVIDE SUPPORT TO LEGACY ONES)
        add_header X-XSS-Protection "1; mode=block" always;

        # Minimizes data leaked via the Referer header
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy baseline configuration
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

        # Buffer Size Management (Mitigates buffer overflows)
        client_body_buffer_size      1k;
        client_header_buffer_size    1k;
        client_max_body_size         2m;
        large_client_header_buffers  2 1k;

        # Strict Timeout Controls (Forces dropped hanging connections)
        client_body_timeout   12s;
        client_header_timeout 12s;
        keepalive_timeout     15s;
        send_timeout          10s;

        #disable google index for the dev hostname
        add_header X-Robots-Tag $seo_robots always;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        location ~ /\. {
            deny            all;
            access_log      off;
            log_not_found   off;
            return          404;
        }

        location / {
        # Block unauthorized access to dev only
            if ($deny_dev = 1) {
                return 403;
            }

            autoindex off;
            root /williansrico.dev/site;
            index index.html index.htm;

            try_files $uri $uri/ =404;
        }
    }
}

